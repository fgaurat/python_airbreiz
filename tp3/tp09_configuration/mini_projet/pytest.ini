# Mini-projet autonome pour montrer l'effet du fichier de configuration.
# Ce pytest.ini n'est utilisé QUE si les arguments de pytest sont dans ce
# dossier : `uv run pytest tp09_configuration/mini_projet`.
# Lancé depuis la racine, c'est le pyproject.toml racine qui s'applique et
# ce fichier est ignoré.
[pytest]
addopts = -v
python_files = test_*.py verif_*.py
markers =
    regle: regle metier verifiee
