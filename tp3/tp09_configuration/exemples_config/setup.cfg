# Format setup.cfg : section [tool:pytest] (avec deux-points).
# Format historique, déconseillé : à ne reconnaître que dans du code existant.
[metadata]
name = formation-pytest

[tool:pytest]
minversion = 8.0
pythonpath = .
addopts = -ra --strict-markers
markers =
    lent: test long a executer (desactivable avec -m 'not lent')
    integration: test necessitant une ressource externe (BDD, API...)
testpaths = tp01_bases tp02_classes
