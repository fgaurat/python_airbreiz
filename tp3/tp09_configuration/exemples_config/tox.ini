# Format tox.ini : section [pytest], même syntaxe que pytest.ini.
# Rencontré dans les projets qui utilisent tox pour tester plusieurs Python.
[tox]
envlist = py312, py313

[testenv]
deps = pytest
commands = pytest

[pytest]
minversion = 8.0
pythonpath = .
addopts = -ra --strict-markers
markers =
    lent: test long a executer (desactivable avec -m 'not lent')
    integration: test necessitant une ressource externe (BDD, API...)
testpaths = tp01_bases tp02_classes
