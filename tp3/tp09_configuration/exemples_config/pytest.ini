# Équivalent de la configuration du pyproject.toml racine, au format pytest.ini.
# Format INI : les listes sont des lignes indentées, les chaînes sont nues.
# Un pytest.ini est TOUJOURS prioritaire sur les autres fichiers, même vide.
[pytest]
minversion = 8.0
pythonpath = .
addopts = -ra --strict-markers
markers =
    lent: test long a executer (desactivable avec -m 'not lent')
    integration: test necessitant une ressource externe (BDD, API...)
    reseau: test utilisant le reseau
    donnees(fichier): fichier de donnees a charger pour le test
    bdd: test necessitant une base de donnees
    prioritaire: test a executer en premier (voir TP10)
    docker: test demarrant un conteneur Docker (voir TP13)
testpaths =
    tp01_bases
    tp02_classes
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %H:%M:%S
